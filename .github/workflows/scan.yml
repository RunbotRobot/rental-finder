name: scan

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Addresses you've added to listings on the site come back as overrides.
      # The profile is still needed here even though this workflow never
      # sends: it's what decides whether a listing is complete enough to be
      # drafted at all, and it's used to fill the Craigslist manual-copy
      # draft on the site. The already-emailed list comes from the site
      # too, so a listing a Claude session already emailed (see README --
      # RentCast outreach is drafted and sent by a Claude session on a
      # recurring check-in, not by this workflow) is correctly reported as
      # already contacted rather than ready to send.
      - name: Fetch overrides, profile, and already-emailed ids from the site
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          curl -sSf -H "Authorization: Bearer $API_TOKEN" "$WORKER_URL/api/overrides" -o address_overrides.csv
          echo "$(($(wc -l < address_overrides.csv) - 1)) overrides"
          curl -sSf -H "Authorization: Bearer $API_TOKEN" "$WORKER_URL/api/profile" -o applicant_profile.json
          curl -sSf -H "Authorization: Bearer $API_TOKEN" "$WORKER_URL/api/emailed" -o emailed.json
          echo "$(python3 -c 'import json; print(len(json.load(open("emailed.json"))))') listings already emailed"

      # No --send-emails and no Gmail credentials here on purpose: this
      # workflow only ever computes and publishes which listings are
      # gate-eligible ("ready to send"). Nothing sends automatically --
      # see README's "Outreach and auto-send" section.
      - name: Run the scan
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: |
          python -m rental_finder.main --out candidates.csv --json data.json \
            --profile applicant_profile.json --emailed emailed.json -v

      - name: Publish results to the site
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          curl -sSf -X PUT -H "Authorization: Bearer $API_TOKEN" -H "Content-Type: application/json" \
            --data-binary @data.json "$WORKER_URL/api/data"

      # The cache is what makes "new since last run" and the detail-page cap
      # work across runs, so it lives in the repo.
      - name: Commit cache
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add -f cache.json
          git diff --cached --quiet || git commit -m "Update scan cache [skip ci]"
          git push
